<div class="text-dark overflow-hidden default" style="background-image: url('images/img3.jpg');">
   <div class="m-3">
    <h2 class="text-light">Liste des Réponses</h2>
    <button class="btn btn-primary mb-3" data-toggle="modal" data-target="#addAnswerModal">Ajouter une Réponse</button>

    <table class="table table-bordered text-light">
        <thead class="bg-success">
            <tr>
                <th>Question</th>
                <th>Réponse</th>
                <th>Correcte ?</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody class="bg-dark">
            <tr *ngFor="let answer of answers">
                <td>{{ answer.question }}</td>
                <td>{{ answer.answer }}</td>
                <td>{{ answer.correct}}</td>
                <td>
                    <button class="btn btn-primary" data-toggle="modal" data-target="#addAnswerModal"> Modifier</button> <span>||</span>
                    <button class="btn btn-danger" (click)="deleteAnswer(answer.id)">Supprimer</button>
                </td>
            </tr>
            <tr *ngIf="answers.length === 0">
                <td colspan="4">Aucune réponse trouvée.</td>
            </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="addAnswerModal" tabindex="-1" role="dialog" aria-labelledby="addAnswerModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addAnswerModalLabel">Ajouter une Réponse</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body bg-success">
                <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
                    <div class="form-group">
                        <label for="questionID">Question</label>
                        <select id="questionID" class="form-control" formControlName="question" required>
                            <option value="" disabled selected>Sélectionnez une question</option>
                            <option *ngFor="let question of questions" [value]="question.id">{{ question.question }}</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="answerText">Réponse</label>
                        <textarea class="form-control" id="answerText" formControlName="answerText" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="isCorrect">Correcte ?</label>
                        <select class="form-control" id="isCorrect" formControlName="isCorrect" required>
                            <option value="1">Oui</option>
                            <option value="0">Non</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </form>
            </div>
        </div>
    </div>
   </div>
</div>

<script>
    document.getElementById('addAnswerForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const questionId = document.getElementById('questionID').value;
        const answerText = document.getElementById('answerText').value;
        const isCorrect = document.getElementById('isCorrect').value;

        // Ajouter la réponse à la table dans le DOM
        const tableBody = document.getElementById('answerTableBody');
        const newRow = `<tr>
            <td>${questionId}</td>
            <td>${answerText}</td>
            <td>${isCorrect === '1' ? 'Oui' : 'Non'}</td>
        </tr>`;
        tableBody.insertAdjacentHTML('beforeend', newRow);

        // Réinitialiser le formulaire et fermer le modal
        document.getElementById('addAnswerForm').reset();
        $('#addAnswerModal').modal('hide');

        // Ici, vous pouvez envoyer les données à votre serveur via AJAX ou fetch
        fetch('/api/answers', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ question_id: questionId, answer_text: answerText, is_correct: isCorrect })
        })
        .then(response => response.json())
        .then(data => {
            console.log(data);
        })
        .catch(error => {
            console.error('Erreur:', error);
        });
    });
</script>
